name: Android Capacitor Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/configure-clean-android.mjs'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-capacitor-build.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android version code (must increase for every Play upload)'
        required: true
        default: '6'
      version_name:
        description: 'User-facing Yardit version name'
        required: true
        default: '1.0.6'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Yardit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build Yardit web bundle
        run: npm run build

      - name: Create stable Android shell if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            echo "Creating Yardit's clean Android shell once."
            npx cap add android
            node scripts/configure-clean-android.mjs
            npx cap sync android

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android
            git commit -m "Create stable Yardit Android Capacitor shell"
            git push
          else
            echo "Using committed stable Android shell."
          fi

      - name: Sync Yardit into stable Android shell
        run: npx cap sync android

      - name: Verify Android identity and wiring
        shell: bash
        run: |
          grep -q 'com.base690f554506edf795e5d84121.app' android/app/build.gradle
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -q 'OneSignalCapacitor' android/app/src/main/assets/capacitor.plugins.json

      - name: Compile Android debug app
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Yardit test APK
        uses: actions/upload-artifact@v4
        with:
          name: yardit-capacitor-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare Yardit release signing
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          echo "${{ secrets.YARDIT_UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/yardit-upload-key.jks"

      - name: Build signed Play Store AAB
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: android
        env:
          YARDIT_KEYSTORE_PATH: ${{ runner.temp }}/yardit-upload-key.jks
          YARDIT_KEYSTORE_PASSWORD: ${{ secrets.YARDIT_UPLOAD_KEYSTORE_PASSWORD }}
          YARDIT_KEY_ALIAS: ${{ secrets.YARDIT_UPLOAD_KEY_ALIAS }}
          YARDIT_KEY_PASSWORD: ${{ secrets.YARDIT_UPLOAD_KEY_PASSWORD }}
          YARDIT_VERSION_CODE: ${{ inputs.version_code }}
          YARDIT_VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew bundleRelease

      - name: Upload signed Yardit AAB
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: yardit-play-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
