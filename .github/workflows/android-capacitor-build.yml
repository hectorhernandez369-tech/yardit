name: Android Capacitor Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-capacitor-build.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android version code (must increase for every Play upload)'
        required: true
        default: '2'
      version_name:
        description: 'User-facing Yardit version name'
        required: true
        default: '1.0.1'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Yardit
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Build Yardit web bundle
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Compile Android debug app
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload Yardit test APK
        uses: actions/upload-artifact@v4
        with:
          name: yardit-capacitor-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare Yardit release signing
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          echo "${{ secrets.YARDIT_UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/yardit-upload-key.jks"
      - name: Build signed Play Store AAB
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: android
        env:
          YARDIT_KEYSTORE_PATH: ${{ runner.temp }}/yardit-upload-key.jks
          YARDIT_KEYSTORE_PASSWORD: ${{ secrets.YARDIT_UPLOAD_KEYSTORE_PASSWORD }}
          YARDIT_KEY_ALIAS: ${{ secrets.YARDIT_UPLOAD_KEY_ALIAS }}
          YARDIT_KEY_PASSWORD: ${{ secrets.YARDIT_UPLOAD_KEY_PASSWORD }}
          YARDIT_VERSION_CODE: ${{ inputs.version_code }}
          YARDIT_VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew bundleRelease
      - name: Upload signed Yardit AAB
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: yardit-play-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
