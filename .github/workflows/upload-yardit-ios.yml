name: Upload Yardit to Apple

on:
  workflow_dispatch:

# Draft release assets require push access. No release is published by this workflow.
permissions:
  contents: write

concurrency:
  group: yardit-apple-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Download the saved draft IPA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          releases = [r for page in json.loads((root / "releases.json").read_text()) for r in page]
          assets = [a for r in releases if r["draft"] and r["name"] == "Yardit iOS Upload"
                    for a in r["assets"] if a["name"] == "ios-2.133512.2.ipa" and a["state"] == "uploaded"]
          if len(assets) != 1:
              raise SystemExit("Expected exactly one uploaded IPA in the draft named Yardit iOS Upload.")
          endpoint = f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/assets/{assets[0]["id"]}'
          with (root / "yardit.ipa").open("wb") as output:
              subprocess.run(["gh", "api", endpoint, "-H", "Accept: application/octet-stream"], stdout=output, check=True)
          PY

      - name: Verify the original Yardit build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, plistlib, zipfile
          from pathlib import Path
          ipa = Path(os.environ["RUNNER_TEMP"]) / "yardit.ipa"
          expected = "c0d8949841d770ac9c074ed80333c189d95d4300bf8d7330e67a7a2ca98d3dbf"
          if hashlib.sha256(ipa.read_bytes()).hexdigest() != expected:
              raise SystemExit("IPA differs from the build checked for this upload.")
          with zipfile.ZipFile(ipa) as z:
              paths = [p for p in z.namelist() if p.startswith("Payload/") and p.count("/") == 2 and p.endswith("/Info.plist")]
              if len(paths) != 1:
                  raise SystemExit("Expected one main app.")
              info = plistlib.loads(z.read(paths[0]))
          for key, value in {
              "CFBundleIdentifier": "com.base690f554506edf795e5d84121.app",
              "CFBundleShortVersionString": "2.133512.2",
              "CFBundleVersion": "2",
          }.items():
              if info.get(key) != value:
                  raise SystemExit(f"Unexpected {key}")
          print("Verified Yardit version 2.133512.2, build 2.")
          PY

      - name: Upload to App Store Connect
        env:
          APPLE_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLE_KEY_ID" && test -n "$APPLE_ISSUER_ID" && test -n "$APPLE_PRIVATE_KEY"
          [[ "$APPLE_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_KEY_ID}.p8"
          trap 'rm -f "$key_path"' EXIT
          printf '%s\n' "$APPLE_PRIVATE_KEY" > "$key_path"
          unset APPLE_PRIVATE_KEY
          openssl pkey -in "$key_path" -noout
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/yardit.ipa" --apiKey "$APPLE_KEY_ID" --apiIssuer "$APPLE_ISSUER_ID"
          echo "Upload command completed. Check App Store Connect TestFlight for processing." >> "$GITHUB_STEP_SUMMARY"
